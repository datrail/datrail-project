# Weekly dependency updates (DR-298). Minor and patch bumps are grouped per
# ecosystem; majors and security updates come as their own PRs, each going
# through CI and rail-review. The stack's own RailMon/RailDash image tags in
# docker-compose.yml are pinned on purpose by each release, so
# docker-compose.yml is not watched here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories:
      - "/tests/openclaw"
      - "/tests/openshell/fixtures"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        update-types: ["minor", "patch"]
