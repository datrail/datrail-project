name: Stack from default branches

# Runs docker-compose.yml the way the README's quick start does: both images
# built from each component's default branch, nothing published involved.
# The schedule catches a change in railmon or raildash that breaks the stack
# even when nothing in this repository changed.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job id is the required status check on master; keep it.
  install:
    # Named, not ubuntu-latest, so a runner image move is a deliberate change.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the quick-start stack and check what it shows
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
        run: bash tests/stack-acceptance.sh
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error

  # INSTALL.md's "Watch your own agent": the stack without the demo agent,
  # pointed at a container started afterwards. Its job id is a required
  # status check on master too; keep it.
  own-agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-own-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Docker Desktop's image store (DR-212). With the runner's default
      # overlay2 store, Compose building one image name twice at once
      # succeeds; on the containerd store all but the first build fail.
      - name: Use the containerd image store, as Docker Desktop does
        run: |
          # Keep whatever the runner image already configures.
          conf=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          jq '.features["containerd-snapshotter"] = true' <<<"$conf" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}' | tee /dev/stderr | grep -q 'io.containerd.snapshotter'
      - name: Watch your own agent, as INSTALL.md says
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
          STACK_MODE: own-agent
        run: bash tests/stack-acceptance.sh
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: own-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error

  # The quick start on arm64 Linux (DR-208), the architecture Docker
  # Desktop's VM has on Apple Silicon. GitHub's arm64 runners stop at 24.04.
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-arm-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the quick-start stack on arm64 and check what it shows
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
        run: bash tests/stack-acceptance.sh
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error

  # The same agent in an NVIDIA OpenShell sandbox (DR-206), as INSTALL.md's
  # "An agent in an OpenShell sandbox" says: a pinned OpenShell, its gateway
  # on the Docker driver, the sandbox started first.
  openshell:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-os-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install OpenShell and start its gateway
        run: bash tests/openshell/install.sh
      - name: Watch an agent in an OpenShell sandbox
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
          STACK_MODE: openshell
        run: bash tests/stack-acceptance.sh
      - name: Preserve OpenShell's gateway log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/stack"
          journalctl --user -u openshell-gateway --no-pager > "$RUNNER_TEMP/stack/openshell-gateway.log" 2>&1 || true
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openshell-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error
