name: Stack from default branches

# Runs docker-compose.yml with both images built from each component's
# default branch, so the schedule catches a change in railmon or raildash
# that breaks the stack even when nothing in this repository changed. The
# `published` job runs the install as users get it: the fixed tags
# docker-compose.yml pins, pulled, nothing built (DR-137); the `openclaw`
# job runs those images too, against a real agent it builds. A manual run
# can name other published images instead (DR-214), as INSTALL.md's
# "Images" says.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      railmon_image:
        description: "Published RailMon image to pull instead of building, e.g. ghcr.io/datrail/railmon:0.1.0-m4"
        required: false
        default: ""
      raildash_image:
        description: "Published RailDash image to pull instead of building"
        required: false
        default: ""
      openshell_version:
        description: "The openshell job only: an OpenShell release to try instead of the pinned one, e.g. 0.1.5 (with its .deb's sha256)"
        required: false
        default: ""
      openshell_deb_sha256:
        description: "The sha256 of that release's amd64 .deb, from its openshell-checksums-sha256.txt"
        required: false
        default: ""

permissions:
  contents: read

# Empty unless a manual run names them; empty means build from source.
env:
  RAILMON_IMAGE: ${{ inputs.railmon_image }}
  RAILDASH_IMAGE: ${{ inputs.raildash_image }}

jobs:
  # The job id is the required status check on master; keep it.
  install:
    # Named, not ubuntu-latest, so a runner image move is a deliberate change.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the quick-start stack and check what it shows
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
        run: bash tests/stack-acceptance.sh
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error

  # INSTALL.md's "Watch your own agent": the stack without the demo agent,
  # pointed at a container started afterwards. Its job id is a required
  # status check on master too; keep it.
  own-agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-own-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Docker Desktop's image store (DR-212), so this job runs the stack
      # on the store a Mac user has rather than the runner's overlay2.
      - name: Use the containerd image store, as Docker Desktop does
        run: |
          # Keep whatever the runner image already configures.
          conf=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          jq '.features["containerd-snapshotter"] = true' <<<"$conf" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}' | tee /dev/stderr | grep -q 'io.containerd.snapshotter'
      - name: Watch your own agent, as INSTALL.md says
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
          STACK_MODE: own-agent
        run: bash tests/stack-acceptance.sh
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: own-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error

  # The quick start exactly as pinned: docker-compose.yml's published tags,
  # pulled and checked to be the registry's own digests, nothing built.
  # Skipped when a manual run names images, which the other jobs then run.
  published:
    if: inputs.railmon_image == '' && inputs.raildash_image == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-pub-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the pinned published images and check what they show
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
          STACK_IMAGES: pinned
        run: bash tests/stack-acceptance.sh
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error

  # The components' own acceptance against the same pinned images, nothing
  # built (DR-233, DR-235): RailDash's ASP v1 oracle inside its image (replay,
  # drift, switch away and back, rule-pack mismatch), then RailMon's two-agent
  # and multi-agent drift scenarios from the pinned tag's tests/, run in the
  # pinned RailMon image against the pinned RailDash, then the rest of its
  # DR-109 acceptance in the pinned RailMon image alone (DR-256).
  published-acceptance:
    if: inputs.railmon_image == '' && inputs.raildash_image == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pull the pinned images
        id: pins
        run: |
          pinned=$(docker compose config --format json)
          railmon=$(jq -r '.services["railmon-collect"].image' <<<"$pinned")
          raildash=$(jq -r '.services.raildash.image' <<<"$pinned")
          [[ $railmon == ghcr.io/datrail/railmon:* && $raildash == ghcr.io/datrail/raildash:* ]]
          docker pull "$railmon"
          docker pull "$raildash"
          {
            echo "railmon=$railmon"
            echo "raildash=$raildash"
            echo "railmon_tag=v${railmon##*:}"
          } >> "$GITHUB_OUTPUT"
      # Test scripts only, from the tag the RailMon image was built from;
      # nothing here is built.
      - uses: actions/checkout@v7
        with:
          repository: datrail/railmon
          ref: ${{ steps.pins.outputs.railmon_tag }}
          path: railmon
          sparse-checkout: tests
          persist-credentials: false
      - name: ASP v1 acceptance inside the RailDash image
        env:
          RAILDASH_IMAGE: ${{ steps.pins.outputs.raildash }}
        run: |
          # The default step shell has no pipefail, and tee would hide a failure.
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/acceptance"
          docker run --rm --entrypoint python3 "$RAILDASH_IMAGE" -m raildash.acceptance \
            | tee "$RUNNER_TEMP/acceptance/asp-v1.json"
          jq -e '.acceptance == "passed" and ([.checks[]] | all and length == 6)' \
            "$RUNNER_TEMP/acceptance/asp-v1.json"
      - name: Two agents and multi-agent drift, RailMon image against RailDash image
        env:
          RAILMON_IMAGE: ${{ steps.pins.outputs.railmon }}
          RAILDASH_IMAGE: ${{ steps.pins.outputs.raildash }}
        run: |
          # The default step shell has no pipefail, and tee would hide a failure.
          set -o pipefail
          docker network create published
          docker run -d --name raildash --network published -p 127.0.0.1:8000:8000 "$RAILDASH_IMAGE"
          for _ in $(seq 60); do
            token=$(docker exec raildash cat /data/raildash.db.token 2>/dev/null || true)
            [[ -n $token ]] && curl -fsS http://127.0.0.1:8000/webhook/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          [[ -n $token ]] || { docker logs raildash; exit 1; }
          run() {
            docker run --rm --network published --user 0 --entrypoint python3 \
              -e RAILMON_BIN=/usr/local/bin/railmon-collector \
              -v "$PWD/railmon/tests:/tests:ro" "$RAILMON_IMAGE" "$@"
          }
          run /tests/two_agent_acceptance.py --raildash http://raildash:8000 \
            | tee "$RUNNER_TEMP/acceptance/two-agent.txt" || { docker logs raildash; exit 1; }
          run /tests/multi_agent_drift_acceptance.py --raildash http://raildash:8000 --token="$token" \
            | tee "$RUNNER_TEMP/acceptance/multi-agent-drift.txt" || { docker logs raildash; exit 1; }
      # railmon's CI runs these against the image it builds; here they run
      # against the published one. A target that exits is restarted alone,
      # an unsigned ticket only corroborates or conflicts, a process two keys
      # name gets one shared ambiguous tap, a bad manifest fails closed, and a
      # reused PID is never the old agent's. Each writes its own stub
      # AgentSight, so no eBPF or host PID namespace is involved.
      - name: The rest of RailMon's multi-agent acceptance in the RailMon image
        env:
          RAILMON_IMAGE: ${{ steps.pins.outputs.railmon }}
        run: |
          # The default step shell has no pipefail, and tee would hide a failure.
          set -o pipefail
          for t in target_restart ticket_claim ambiguous_capture fail_closed; do
            echo "::group::${t}_acceptance"
            docker run --rm --user 0 --entrypoint python3 \
              -e RAILMON_BIN=/usr/local/bin/railmon-collector \
              -v "$PWD/railmon/tests:/tests:ro" "$RAILMON_IMAGE" "/tests/${t}_acceptance.py" \
              | tee "$RUNNER_TEMP/acceptance/${t}.txt"
            echo "::endgroup::"
          done
          # Stale PID reuse forces the newcomer onto the old PID through
          # /proc/sys/kernel/ns_last_pid, which takes CHECKPOINT_RESTORE, a
          # writable /proc/sys and no docker-default AppArmor profile, as in
          # railmon's CI. Granted to this one run only.
          docker run --rm --user 0 --entrypoint python3 \
            --cap-add CHECKPOINT_RESTORE \
            --security-opt systempaths=unconfined --security-opt apparmor=unconfined \
            -e RAILMON_BIN=/usr/local/bin/railmon-collector \
            -v "$PWD/railmon/tests:/tests:ro" "$RAILMON_IMAGE" /tests/pid_reuse_acceptance.py \
            | tee "$RUNNER_TEMP/acceptance/pid_reuse.txt"
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error

  # The quick start on arm64 Linux (DR-208), the architecture Docker
  # Desktop's VM has on Apple Silicon. GitHub's arm64 runners stop at 24.04.
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-arm-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the quick-start stack on arm64 and check what it shows
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
        run: bash tests/stack-acceptance.sh
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error

  # The same agent in an NVIDIA OpenShell sandbox (DR-206), as INSTALL.md's
  # "An agent in an OpenShell sandbox" says: a pinned OpenShell, its gateway
  # on the Docker driver, the sandbox started first.
  openshell:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-os-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install OpenShell and start its gateway
        env:
          OPENSHELL_VERSION: ${{ inputs.openshell_version }}
          OPENSHELL_DEB_SHA256: ${{ inputs.openshell_deb_sha256 }}
        run: bash tests/openshell/install.sh
      - name: Watch an agent in an OpenShell sandbox
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
          STACK_MODE: openshell
        run: bash tests/stack-acceptance.sh
      - name: Preserve OpenShell's gateway log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/stack"
          journalctl --user -u openshell-gateway --no-pager > "$RUNNER_TEMP/stack/openshell-gateway.log" 2>&1 || true
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openshell-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error

  # A real agent (DR-137): OpenClaw from npm, pinned, watched as INSTALL.md's
  # "Watch your own agent" says, against a stub model on HTTPS that streams
  # a tool call every turn. It runs the images docker-compose.yml pins (or a
  # manual run's), since a user's agent meets those: its streamed calls and
  # tool calls must arrive (railmon#70), and a locked baseline and the
  # adopted guardrail must hold through its turns (railmon#97).
  openclaw:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: datrail-ci-oc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Watch a real OpenClaw agent
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/stack
        run: bash tests/openclaw/acceptance.sh
      - name: Preserve service logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stack
          if-no-files-found: error
