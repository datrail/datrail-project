name: Walk INSTALL.md on a fresh VM

# The throwaway-VM gate of a release (DR-136, DR-137; DR-252): a
# GitHub-hosted runner is a freshly provisioned Linux VM, discarded after the
# job, on x86_64 and on arm64 (DR-255), the architecture Docker Desktop's VM
# has on Apple Silicon. tests/install-walk.sh runs INSTALL.md's own commands
# on it, at a user's default settings, from an empty directory, and keeps the
# transcript, the host's facts, the pulled digests, timings and dashboard
# screenshots. Run by hand before a release, and on a change to the page or
# to what it installs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - INSTALL.md
      - docker-compose.yml
      - Makefile
      - tests/install-walk.sh
      - .github/workflows/install-walk.yml

permissions:
  contents: read

jobs:
  walk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          # GitHub's arm64 runners stop at 24.04.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: walk (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      # Only for INSTALL.md and the walk; the walk clones the repository
      # itself, as a user does.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The walk's screenshots take a headless Chrome or Chromium on PATH.
      # The x86_64 runner has Chrome; there's none for arm64 Linux, so that
      # leg gets Playwright's Chromium, pinned, as `chromium`.
      - name: A headless browser for the screenshots
        if: matrix.arch == 'aarch64'
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.64.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" \
            "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium
          chrome=$(find "$RUNNER_TEMP/pw-browsers" -type f -name chrome -path '*/chromium-*/*' | head -1)
          [ -x "$chrome" ] || { echo "no Chromium in $RUNNER_TEMP/pw-browsers"; exit 1; }
          "$chrome" --headless=new --no-sandbox --version
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$chrome" "$RUNNER_TEMP/bin/chromium"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Walk INSTALL.md
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/walk
          WALK_ARCH: ${{ matrix.arch }}
          # A PR's head, which the clone and the downloaded file move to;
          # a manual run walks master as cloned.
          WALK_REF: ${{ github.event.pull_request.head.sha }}
        run: bash tests/install-walk.sh
      - name: Preserve the walk's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-walk-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/walk
          if-no-files-found: error
