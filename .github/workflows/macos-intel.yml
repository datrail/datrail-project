# `make test` on an Intel Mac (DR-254's follow-up): macOS's own bash 3.2 and
# Python run the script, and Docker's engine is a Colima VM, as Docker
# Desktop's is on a user's Mac. GitHub's Intel macOS runners have nested
# virtualization; its Apple Silicon ones don't, so arm64 stays the Linux
# arm64 jobs' to prove. Not a required check: a macOS runner is slower and
# scarcer than the Linux ones.
name: macOS Intel
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker-compose.yml
      - Makefile
      - tests/stack-acceptance.sh
      - tests/stack_acceptance.py
      - .github/workflows/macos-intel.yml
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

jobs:
  make-test:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start Docker in a Colima VM
        run: |
          brew install colima docker docker-compose docker-buildx jq
          mkdir -p ~/.docker/cli-plugins
          for plugin in docker-compose docker-buildx; do
            ln -sfn "$(brew --prefix)/opt/$plugin/bin/$plugin" ~/.docker/cli-plugins/$plugin
          done
          colima start --cpu 3 --memory 8 --vm-type vz
          docker info --format '{{.OperatingSystem}} {{.KernelVersion}} {{.Architecture}}'
      # The runner image has Homebrew's bash 5 and a newer Python first on
      # PATH; a user's Mac may have only macOS's own bash 3.2 and the
      # Command Line Tools' /usr/bin/python3, which `make test` must run under.
      - name: make test on the pinned images, under macOS's bash 3.2 and Python
        run: |
          mkdir -p "$RUNNER_TEMP/macos-tools" "$RUNNER_TEMP/evidence"
          ln -sfn /bin/bash "$RUNNER_TEMP/macos-tools/bash"
          ln -sfn /usr/bin/python3 "$RUNNER_TEMP/macos-tools/python3"
          export PATH="$RUNNER_TEMP/macos-tools:$PATH"
          [[ $(uname -s) == Darwin && $(bash -c 'echo "${BASH_VERSINFO[0]}"') == 3 ]]
          [[ $(command -v python3) == "$RUNNER_TEMP/macos-tools/python3" ]]
          bash --version | head -1; python3 --version
          STACK_IMAGES=pinned EVIDENCE_DIR="$RUNNER_TEMP/evidence" make test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
