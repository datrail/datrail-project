name: macOS Intel probe
on:
  push:
    branches: [DR-254-macos-intel-make-test]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sw_vers; uname -m; sysctl -n machdep.cpu.features | tr ' ' '\n' | grep -i vmx || echo "no vmx"; sysctl kern.hv_support || true
      - run: brew install colima docker docker-compose jq qemu lima
      - run: |
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose
          colima start --cpu 3 --memory 8 --vm-type vz || colima start --cpu 3 --memory 8 --vm-type qemu
          docker info
          docker run --rm alpine test -r /sys/kernel/btf/vmlinux && echo BTF ok
      - run: bash --version | head -1; python3 --version
      - run: STACK_IMAGES=pinned make test
