# DatRail: RailMon and RailDash, always on, from one command.
#
#   docker compose up -d            # the first run pulls both images
#   open http://127.0.0.1:8000
#   docker compose down             # stop (add -v to delete the data too)
#
# README.md has the quick start. INSTALL.md lists every setting below.
#
# What runs:
#
#   raildash        the dashboard, on 127.0.0.1:8000 only
#   railmon-collect captures the agent's TLS traffic (eBPF) and posts each
#                   request/response pair to RailDash's webhook as it happens,
#                   with RailDash's token and a heartbeat while it is attached
#   railmon-listen  records every socket the agent opens to accept traffic
#   railmon-files   records every file the agent opens to read, write or run
#   railmon-scan    scans the agent every SCAN_INTERVAL seconds and posts the
#                   evidence bundle to RailDash, where it becomes an Agent
#                   Security Profile (ASP); also to a Rail Center, only if
#                   RAIL_CENTER_URL is set
#   demo-agent      a small stand-in agent, so a first run has something to
#                   watch; replace it with your own (INSTALL.md)
#   openshell-collector  opt-in (--profile openshell): an OpenShell sandbox's
#                   policy and the denials its supervisor logged, read from
#                   OpenShell's gateway (INSTALL.md)
#   docker-proxy    lets the three sensors look up the agent's container in
#                   Docker, and nothing else (below)
#
# Nothing needs a manual restart or import: every service keeps running and
# delivers on its own.
#
# What each service is allowed (DR-288). Nothing runs privileged. The three
# sensors (railmon-collect, -listen and -files) get the capabilities their
# eBPF probes need, BPF, PERFMON and SYS_ADMIN, SYS_PTRACE to follow an
# agent that runs as another user, and the host's PID namespace to see the
# agent's processes. That is still root-equivalent on the host, so run
# DatRail where you would run any root service. They ask Docker only
# through docker-proxy, which answers the few read-only calls they make and
# refuses everything else, so they never start, change or exec into a
# container. That limits what they ask Docker; it is no wall against a
# sensor that is itself compromised, which with these capabilities could
# reach Docker another way. railmon-scan still mounts the Docker socket: the
# pinned RailMon runs commands in the agent's container to read its setup.
# From rule pack 16 (DR-300) it reads the agent's files through the host PID
# namespace with SYS_PTRACE instead, and can then move behind docker-proxy.
# The sensors, railmon-scan and docker-proxy have read-only
# filesystems and can't gain privileges.
#
# Each component runs a fixed published tag, pinned below: RailMon and
# RailDash each carry their own. Set RAILMON_IMAGE / RAILDASH_IMAGE to run
# another published tag. To build from source instead, name local images
# and build: `make update` does that, from each repository's default branch
# (INSTALL.md, "Images"). Point RAILMON_SRC / RAILDASH_SRC at a local
# checkout to build that instead; a railmon checkout needs its submodules
# (`git clone --recursive`). A git URL context is fetched with its
# submodules, so this file needs nothing else from its repository:
# downloading it alone is enough.

# Every RailMon service runs one image, and only railmon-collect builds it.
# Compose builds services in parallel, and on Docker Desktop's containerd
# image store a second build of the same image name fails.
x-railmon: &railmon
  image: ${RAILMON_IMAGE:-ghcr.io/datrail/railmon:0.1.0-m17}
  restart: unless-stopped

# The three sensors: the capabilities their eBPF probes need instead of
# --privileged (SYS_PTRACE for an agent that runs as another user, such as
# an OpenShell sandbox's), the host's PID namespace to see the agent's
# processes, and Docker through docker-proxy only. A read-only filesystem, with /tmp for
# what the probes unpack at start.
x-sensor: &sensor
  cap_add: [BPF, PERFMON, SYS_ADMIN, SYS_PTRACE]
  pid: host
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp:exec,mode=1777"]
  networks: [default, docker-api]

services:
  raildash:
    image: ${RAILDASH_IMAGE:-ghcr.io/datrail/raildash:0.2.0-rc.18}
    build:
      context: ${RAILDASH_SRC:-https://github.com/datrail/raildash.git}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAILDASH_PORT:-8000}:8000"
    volumes:
      - raildash-data:/data
    environment:
      RAILDASH_DB: /data/raildash.db
      # RailDash's local write token guards every route that changes ASP or
      # baseline state, including the one RailMon delivers evidence bundles
      # to. The interaction webhook needs none, but railmon-collect sends it
      # anyway so RailDash knows its captures are the collector's.
      # RailDash writes it to /data/raildash.db.token, and railmon-scan and
      # railmon-collect read it from there, so it never needs to be set. The
      # file survives restarts. Set RAILDASH_TOKEN only to choose the token
      # yourself (see INSTALL.md).
      RAILDASH_TOKEN: ${RAILDASH_TOKEN:-}
      # `off` makes the Data Guardrail read every request body as an upload
      # again (see INSTALL.md, Settings).
      RAILDASH_BODY_KINDS: ${RAILDASH_BODY_KINDS:-}
    healthcheck:
      # The image has no curl, so the check uses Python's standard library.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/webhook/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  railmon-collect:
    <<: [*railmon, *sensor]
    build:
      context: ${RAILMON_SRC:-https://github.com/datrail/railmon.git}
    # The eBPF TLS probe needs BPF, PERFMON and SYS_ADMIN (SYS_ADMIN also to
    # read the agent's memory maps, and SYS_PTRACE when the agent runs as
    # another user) and the host's PID namespace to see the
    # agent's processes, so this container is still root-equivalent on the
    # host. Docker, through docker-proxy, is how it finds the agent's
    # container, and finds it again after a restart.
    volumes:
      # Read-only, for RailDash's token file only.
      - raildash-data:/raildash:ro
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      # Sent with every capture, which marks it as this collector's rather
      # than anyone's who can reach the webhook, and with a heartbeat while
      # a tap is attached, so RailDash can tell a quiet agent from a stopped
      # collector. Re-read on every batch.
      RAIL_RAILDASH_TOKEN_FILE: /raildash/raildash.db.token
      # The agent's container: the collector taps the TLS library its agent
      # uses (a loaded libssl, or one built into the executable, as Node's
      # is) for that container's processes only, and attaches again when it
      # restarts.
      RAIL_COLLECT_CONTAINER: ${AGENT_CONTAINER:-datrail-demo-agent}
      # Set to choose the processes yourself instead (--comm, --pid, --uid,
      # --binary-path; see INSTALL.md), e.g. for an agent not in a container.
      COLLECT_TARGET: ${COLLECT_TARGET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until [ -s "$$RAIL_RAILDASH_TOKEN_FILE" ]; do sleep 1; done;
        if [ -n "$$COLLECT_TARGET" ]; then unset RAIL_COLLECT_CONTAINER; fi;
        exec railmon collect --mode http
        --webhook http://raildash:8000/webhook/http-interactions
        $$COLLECT_TARGET
    depends_on:
      raildash:
        condition: service_healthy
      docker-proxy:
        condition: service_started

  railmon-listen:
    <<: [*railmon, *sensor]
    # BPF, PERFMON and SYS_ADMIN (SYS_PTRACE for an agent that runs as
    # another user) and the host PID namespace so it can run
    # AgentSight's process probe scoped to the agent's PID namespace, out of
    # the agent's reach. The probe reads the kernel's tracing folder, mounted
    # read-only since an unprivileged container doesn't see it. Docker,
    # through docker-proxy, is how it finds the agent's container, and finds
    # it again after a restart.
    volumes:
      - listen-data:/listen
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      RAIL_LISTEN_CONTAINER: ${AGENT_CONTAINER:-datrail-demo-agent}
      RAIL_LISTEN_FILE: /listen/listen.jsonl
    command: ["listen"]
    depends_on:
      docker-proxy:
        condition: service_started

  railmon-files:
    <<: [*railmon, *sensor]
    # The same as railmon-listen, recording file opens from the same probe: it
    # follows the agent's container through restarts and appends one line
    # the first time each of its processes opens a file for reading, writing
    # or running. Paths and access only, never file contents.
    volumes:
      - files-data:/files
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      RAIL_FILES_CONTAINER: ${AGENT_CONTAINER:-datrail-demo-agent}
      RAIL_FILES_FILE: /files/files.jsonl
    command: ["files"]
    depends_on:
      docker-proxy:
        condition: service_started

  railmon-scan:
    <<: *railmon
    # From RailMon's rule pack 16 (DR-300) the scan runs nothing in the agent's
    # container: it reads the agent's own files through /proc/<pid>/root, which
    # takes the host PID namespace, and SYS_PTRACE for an agent that isn't
    # root. Not privileged. Docker is then asked only to inspect.
    pid: host
    cap_add: [SYS_PTRACE]
    # It still mounts the Docker socket itself rather than docker-proxy: the
    # pinned RailMon (rule pack 14) still runs `docker exec` in the agent's
    # container, which docker-proxy refuses. Until the scan moves behind the
    # proxy, this socket is root-equivalent on the host too. /.rail, where it
    # writes each bundle, is in memory: it starts empty after a restart, as it
    # already did after a recreate.
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp", "/.rail"]
    volumes:
      # `scan --mode docker` inspects the agent's container through Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      - listen-data:/listen:ro
      - files-data:/files:ro
      # What openshell-collector last read of the sandbox's policy, when it
      # runs (DR-266); empty otherwise, and the allow-list stays unread.
      - openshell-data:/openshell:ro
      # Read-only, for RailDash's token file only.
      - raildash-data:/raildash:ro
    environment:
      AGENT_CONTAINER: ${AGENT_CONTAINER:-datrail-demo-agent}
      RAIL_OPENSHELL_POLICY_FILE: /openshell/policy.json
      AGENT_KEY: ${AGENT_KEY:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
      RAIL_LISTEN_FILE: /listen/listen.jsonl
      RAIL_FILES_FILE: /files/files.jsonl
      RAIL_RAILDASH_URL: http://raildash:8000
      # Names this machine in every evidence bundle (the bundle requires
      # one). Set it to the value your other DatRail components report, if
      # any; the default only has to be stable.
      RAIL_HOST_ID: ${RAIL_HOST_ID:-datrail-local}
      # Optional. Set RAIL_CENTER_URL to also send every bundle to a Rail
      # Center, with the credential RAIL_AUTH_MODE names (INSTALL.md).
      # Unset, the stack stays local and these are ignored.
      RAIL_CENTER_URL: ${RAIL_CENTER_URL:-}
      RAIL_AUTH_MODE: ${RAIL_AUTH_MODE:-}
      RAIL_AUTH_TOKEN: ${RAIL_AUTH_TOKEN:-}
      RAIL_AUTH_AUDIENCE: ${RAIL_AUTH_AUDIENCE:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        token_file=/raildash/raildash.db.token
        until [ -s "$$token_file" ]; do sleep 1; done
        RAIL_RAILDASH_TOKEN=$$(cat "$$token_file")
        export RAIL_RAILDASH_TOKEN
        set --
        if [ -n "$$RAIL_CENTER_URL" ]; then set -- --register; fi
        # For AGENT_CONTAINER=openshell:<sandbox>, RailMon names the agent
        # after the sandbox itself unless AGENT_KEY says otherwise.
        key=$${AGENT_KEY:-$$AGENT_CONTAINER}
        case "$$key" in openshell:*) ;; *) set -- "$$@" --agent-key "$$key" ;; esac
        exec railmon scan --mode docker --container "$$AGENT_CONTAINER" \
          --raildash-url "$$RAIL_RAILDASH_URL" \
          --output /tmp/registration-payload.json \
          --interval "$$SCAN_INTERVAL" "$$@"
    depends_on:
      raildash:
        condition: service_healthy
      railmon-listen:
        condition: service_started
      railmon-files:
        condition: service_started

  # Opt-in (DR-249): started only with `--profile openshell` or
  # COMPOSE_PROFILES=openshell, for an agent in an OpenShell sandbox
  # (AGENT_CONTAINER=openshell:<sandbox>). It reads the sandbox's policy and
  # the denials OpenShell's supervisor logged from OpenShell's gateway and
  # posts them to RailDash. The gateway listens on the host's loopback, so
  # this service shares the host's network, and with it every service on
  # host loopback. It mounts the OpenShell CLI's configuration read-only,
  # which on a local gateway is a Platform Admin credential (INSTALL.md).
  # No Docker socket, no privilege, no host PID.
  openshell-collector:
    <<: *railmon
    profiles: [openshell]
    network_mode: host
    volumes:
      - ${OPENSHELL_CONFIG_DIR:-${HOME}/.config/openshell}:/root/.config/openshell:ro
      # Read-only, for RailDash's token file only.
      - raildash-data:/raildash:ro
      # Where it writes each policy it reads, for railmon-scan to carry the
      # sandbox's allow-list in the ASP (DR-266). The policy's fields only:
      # no credential.
      - openshell-data:/openshell
    environment:
      AGENT_CONTAINER: ${AGENT_CONTAINER:-}
      RAIL_OPENSHELL_POLICY_FILE: /openshell/policy.json
      RAIL_OPENSHELL_SANDBOX: ${OPENSHELL_SANDBOX:-}
      RAIL_OPENSHELL_INTERVAL: ${OPENSHELL_INTERVAL:-60}
      # RailDash as the host reaches it: this service isn't on the stack's
      # network.
      RAIL_RAILDASH_URL: http://127.0.0.1:${RAILDASH_PORT:-8000}
      RAIL_RAILDASH_TOKEN_FILE: /raildash/raildash.db.token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until [ -s "$$RAIL_RAILDASH_TOKEN_FILE" ]; do sleep 1; done
        exec railmon openshell
    depends_on:
      raildash:
        condition: service_healthy

  # The sensors' only way to Docker: a read-only allow-list in front of the
  # socket. It answers ping and version, listing containers (how an
  # OpenShell sandbox's container is found by its label) and inspecting the
  # agent's container, named by AGENT_CONTAINER, which is all the sensors
  # ask. For an OpenShell sandbox, whose container name OpenShell generates,
  # it inspects any container. Any other read gets 404, and anything else (an
  # exec, a start, any write) 403. It sits on a network of its own that only
  # the sensors join, and publishes no port. The nginx configuration is
  # inline, so this file is still the whole install.
  docker-proxy:
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [docker-api]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    environment:
      AGENT_CONTAINER: ${AGENT_CONTAINER:-datrail-demo-agent}
      PROXY_CONF: |
        user root;
        pid /tmp/nginx.pid;
        error_log /dev/stderr warn;
        events {}
        http {
          log_format api '$$request_method $$uri $$status';
          access_log /dev/stdout api;
          server {
            listen 2375;
            # Docker gets the path as matched here, not as sent.
            location ~ ^/(v[0-9.]+/)?(_ping|version|containers/json)$$ {
              limit_except GET { deny all; }
              proxy_pass http://unix:/var/run/docker.sock:$$uri$$is_args$$args;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
            }
            location ~ ^/(v[0-9.]+/)?containers/(?<dr_container>[A-Za-z0-9_.-]+)/json$$ {
              limit_except GET { deny all; }
              if ($$dr_container != "@AGENT@") { return 404 '{"message":"not found: DatRail docker-proxy shows the sensors only the agent container"}'; }
              proxy_pass http://unix:/var/run/docker.sock:$$uri$$is_args$$args;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
            }
            # Any other read is "not found", so `docker inspect` of a name
            # that isn't a container still ends in Docker's own "No such
            # object" (which the sensors' start-up check names); anything
            # else is refused.
            location / {
              default_type application/json;
              if ($$request_method ~ ^(GET|HEAD)$$) {
                return 404 '{"message":"not found: DatRail docker-proxy shows the sensors containers only"}';
              }
              return 403 '{"message":"refused by DatRail docker-proxy: the sensors may only look up containers"}';
            }
          }
        }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # The agent's container by name; any container for an OpenShell
        # sandbox. install.sh accepts only a container name or openshell:<name>.
        case "$$AGENT_CONTAINER" in
          openshell:*) only='/@AGENT@/d' ;;
          "" | *[!A-Za-z0-9_.-]*)
            echo "docker-proxy: AGENT_CONTAINER isn't a container name: $$AGENT_CONTAINER" >&2
            exit 1 ;;
          *) only="s/@AGENT@/$$AGENT_CONTAINER/" ;;
        esac
        printf '%s\n' "$$PROXY_CONF" | sed "$$only" > /tmp/nginx.conf
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'

  demo-agent:
    <<: *railmon
    # Fixed so railmon-listen, railmon-files and railmon-scan can find it by
    # name. To watch your own agent instead, set AGENT_CONTAINER and start
    # the stack with `--scale demo-agent=0` (INSTALL.md).
    container_name: datrail-demo-agent
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        demo=/opt/railmon/tools/local-demo
        # Its own process name, so the demo agent is easy to tell apart in
        # `ps` on the host. Beside python3, so Python still finds its
        # standard library.
        cp /usr/local/bin/python3 /usr/local/bin/datrail-demo
        certs=$$(mktemp -d)
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=127.0.0.1 \
          -keyout "$$certs/key.pem" -out "$$certs/cert.pem" >/dev/null 2>&1
        datrail-demo "$$demo/demo_server.py" "$$certs/cert.pem" "$$certs/key.pem" &
        while sleep "$$DEMO_INTERVAL"; do
          datrail-demo "$$demo/demo_client.py" || true
        done
    environment:
      DEMO_INTERVAL: ${DEMO_INTERVAL:-30}
      # The demo's MCP server, declared the way an agent with one server
      # does: `railmon-scan` reads these from the container's environment,
      # so the ASP names the server and RailDash shows its tools as
      # mcp__demo__<tool>.
      AGENT_MCP_NAME: demo
      AGENT_MCP_URL: https://127.0.0.1:8443/mcp
    depends_on:
      railmon-listen:
        condition: service_started
      railmon-files:
        condition: service_started
      railmon-collect:
        condition: service_started

volumes:
  raildash-data:
  listen-data:
  files-data:
  openshell-data:

networks:
  # docker-proxy and the three sensors only; no route out.
  docker-api:
    internal: true
